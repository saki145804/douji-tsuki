<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>douji-tsuki 🌙 - 海外での出産を安心して迎えるために</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ==================== ヘッダー ==================== -->
  <header class="header">
    <div class="header-content">
      <h1>🌙 douji-tsuki</h1>
      <p class="subtitle">海外で安心して出産を迎えるために</p>
    </div>
    <button class="profile-btn" onclick="toggleProfileModal()">👤 プロフィール</button>
  </header>

  <!-- ==================== ナビゲーション ==================== -->
  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('posts', event)">💬 投稿</button>
    <button class="nav-btn" onclick="switchTab('qa', event)">❓ Q&A</button>
  </nav>

  <!-- ==================== メインコンテンツ ==================== -->
  <main class="container">

    <!-- ==================== 投稿タブ ==================== -->
    <section id="posts-tab" class="tab active">
      <!-- 投稿作成フォーム -->
      <div class="form-card">
        <h2>✏️ 投稿を書く</h2>
        <form onsubmit="handleCreatePost(event)">
          <div class="form-group">
            <label for="post-week">妊娠週数</label>
            <input type="number" id="post-week" placeholder="例: 30" required>
          </div>

          <div class="form-group">
            <label for="post-place">あなたの場所</label>
            <input type="text" id="post-place" placeholder="例: アメリカ・ニューヨーク" required>
          </div>

          <div class="form-group">
            <label for="post-text">今の気持ちや体験を書いてください</label>
            <textarea id="post-text" placeholder="例: 30週になりました。最近腰が痛いです..." rows="5" required></textarea>
          </div>

          <div class="form-group">
            <label for="post-author">名前（匿名の月で大丈夫です）</label>
            <input type="text" id="post-author" placeholder="デフォルト: 匿名の月">
          </div>

          <button type="submit" class="btn btn-primary">📤 投稿する</button>
        </form>
      </div>

      <!-- 投稿一覧 -->
      <div class="posts-section">
        <h2>💬 みんなの投稿</h2>
        <div id="posts-place-filter" style="margin-bottom:1rem;"></div>
        <div id="posts-list" class="posts-list">
          <p class="loading">読み込み中...</p>
        </div>
      </div>
    </section>

    <!-- ==================== Q&Aタブ ==================== -->
    <section id="qa-tab" class="tab">
      <!-- 質問作成フォーム -->
      <div class="form-card">
        <h2>❓ 質問を投稿する</h2>
        <form onsubmit="handleCreateQuestion(event)">
          <div class="form-group">
            <label for="qa-week">妊娠週数</label>
            <input type="number" id="qa-week" placeholder="例: 30" required>
          </div>

          <div class="form-group">
            <label for="qa-place">あなたの場所</label>
            <input type="text" id="qa-place" placeholder="例: アメリカ・ニューヨーク" required>
          </div>

          <div class="form-group">
            <label for="qa-question">質問してください</label>
            <textarea id="qa-question" placeholder="例: 出産時の言語サポートについて知りたいです..." rows="4" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">❓ 質問を投稿</button>
        </form>
      </div>

      <!-- Q&A一覧 -->
      <div class="qa-section">
        <h2>❓ Q&A</h2>
        <div id="qa-place-filter" style="margin-bottom:1rem;"></div>
        <div id="qa-list" class="qa-list">
          <p class="loading">読み込み中...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ==================== プロフィールモーダル ==================== -->
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="toggleProfileModal()">✕</button>
      <h2>👤 あなたのプロフィール</h2>
      <form onsubmit="handleSaveProfile(event)">
        <div class="form-group">
          <label for="profile-name">お名前</label>
          <input type="text" id="profile-name" placeholder="例: 太郎妻">
        </div>

        <div class="form-group">
          <label for="profile-country">出産予定地</label>
          <input type="text" id="profile-country" placeholder="例: アメリカ・ニューヨーク">
        </div>

        <div class="form-group">
          <label for="profile-week">現在の妊娠週数</label>
          <input type="number" id="profile-week" placeholder="例: 30">
        </div>

        <div class="form-group">
          <label for="profile-memo">メモ</label>
          <textarea id="profile-memo" placeholder="例: 心配なことなど..." rows="4"></textarea>
        </div>

        <div class="form-group">
          <label style="display:flex; align-items:center; gap:0.5rem; font-weight:600;">
            <input type="checkbox" id="profile-senpai" style="width:auto;">
            👑 先輩ママとして回答する
          </label>
        </div>

        <button type="submit" class="btn btn-primary">💾 保存する</button>
      </form>
    </div>
  </div>

  <!-- ==================== スクリプト ==================== -->
  <script src="supabase-init.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script> 
</body>
</html>
